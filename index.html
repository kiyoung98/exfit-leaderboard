const G = {}; for (const g of D.groups) G[g.group] = g;

const tab = () => D.tables.find(t=>t.key===S.tab) || D.tables[0];

const clsOf = (g, fit) => fit ? ((g.tasks[fit]||{}).experimental_data||"none") : "none";
const fittedOf = (g, fit, T) => { if (!fit) return ""; const t = g.fitted[fit]||"";
  if (!T) return t; const mats = new Set(T.blocks.filter(b=>b.fit).map(b=>D.material[b.fit]));
  return mats.size>1 && D.material[fit] ? D.material[fit]+" · "+t : t; };
const hay = (g, fit) => [g.name,g.base,g.method,fittedOf(g,fit,tab()),...(g.tags||[])].join(" ").toLowerCase();

function tabs(){ const T = tab(); document.getElementById("tabs").innerHTML = D.tables.map(t =>
  '<button class="tab'+(t.key===T.key?" on":"")+'" data-k="'+t.key+'">'+esc(t.title)+'</button>').join("");
  for (const b of document.querySelectorAll(".tab")) b.onclick = () => { S.tab=b.dataset.k; S.f.fit=""; S.sort=null; location.hash=S.tab; draw(); }; }

function opts(T){ const rows = T.blocks.flatMap(b => b.rows.map(k=>[G[k], b])); const u = a => [...new Set(a.filter(Boolean))].sort();
  return {fit: T.blocks.map(b=>[b.fit||"none", b.title]),
          base: u(rows.map(([g])=>g.base)), method: u(rows.map(([g])=>g.method)),
          cls: u(rows.map(([g,b])=>clsOf(g,b.fit))), tag: u(rows.flatMap(([g])=>g.tags||[]))}; }

function bar(){ const T = tab(), o = opts(T);
  const sel = (k, label, items) => '<select data-f="'+k+'"><option value="">'+label+'</option>'+
    items.map(it => { const [v,l] = Array.isArray(it)?it:[it,it]; return '<option value="'+esc(v)+'"'+(S.f[k]===v?" selected":"")+'>'+esc(l)+'</option>'; }).join("")+'</select>';
  let h = '<input id="q" type="search" placeholder="Search entries, models, methods, tags" value="'+esc(S.q)+'">';
  h += sel("fit","Fine-tuned on: all", o.fit) + sel("base","Base model: all", o.base) + sel("method","Method: all", o.method);
  if (o.cls.length>1) h += sel("cls","Experimental data: all", o.cls);
  if (o.tag.length) h += sel("tag","Tag: all", o.tag);
  h += '<button id="reset">Reset</button><span class="sp"></span><span class="n" id="count"></span>';
  const el = document.getElementById("bar"); el.innerHTML = h;
  el.querySelector("#q").oninput = e => { S.q=e.target.value; table(); };
  for (const s of el.querySelectorAll("select")) s.onchange = e => { S.f[s.dataset.f]=e.target.value; table(); };
  el.querySelector("#reset").onclick = () => { S.q=""; for (const k in S.f) S.f[k]=""; S.sort=null; bar(); table(); }; }

function fmt(s, dec, n){ if(!s) return '<span class="dash">—</span>';
  let h = s.mean.toFixed(dec); if (s.sd!==null && s.sd!==undefined) h += '<small>±'+s.sd.toFixed(dec)+'</small>';
  if (n>1 && s.n<n) h += '<small class="part">n='+s.n+'</small>'; return h; }

function chips(g, fit){ const c = [];
  if (fit) { const d = g.tasks[fit]||{}; const cls = d.experimental_data||"none"; if (cls!=="benchmark") c.push([cls,""]);
    if ((d.heldout_conditions||"clean")!=="clean") c.push(["held-out used","warn"]); }
  if (g.admitted.some(a=>a===false)) c.push(["not admitted","warn"]);
  return c.map(([t,k,a]) => '<span class="chip '+k+'" '+(a||"")+'>'+esc(t)+'</span>').join(""); }

function detail(g, fit, span){ const r = (g.rank||{})[fit]; const rows = [];
  if (g.notes) rows.push(["Notes", g.notes]);
  if (fit) rows.push(["Fitted to", fittedOf(g,fit,tab()) || "—"]);
  if (g.openness) rows.push(["Openness", g.openness+" ("+OPEN[g.openness]+")"]);
  if ((g.tags||[]).length) rows.push(["Tags", g.tags.join(", ")]);
  if (fit && r) rows.push(["On-target rank", r.rank+" of "+r.of+" ("+r.cls+" class)"]);
  for (const x of g.reference_data||[]) rows.push(["Reference data", [x.set, x.labels, x.detail].filter(Boolean).join(" · ")]);
  if (g.method) rows.push(["Method", g.method]);
  if (g.recipe) rows.push(["Recipe", /^https?:/.test(g.recipe) ? '<a href="'+esc(g.recipe)+'">'+esc(g.recipe)+'</a>' : esc(g.recipe)]);
  return '<tr class="detail"><td colspan="'+span+'"><dl>'+rows.map(([k,v]) => '<dt>'+k+'</dt><dd>'+(k==="Recipe"?v:esc(v))+'</dd>').join("")+'</dl></td></tr>'; }

function sortKey(g, key, fit, block, T){ if (key==="fitted") return fittedOf(g,fit,T);

    for (const k of b.rows) { const g = G[k];
      if ((!S.f.base || g.base===S.f.base) && (!S.f.method || g.method===S.f.method) && (!S.f.cls || clsOf(g,b.fit)===S.f.cls)
          && (!S.f.tag || (g.tags||[]).includes(S.f.tag)) && (!q || hay(g,b.fit).includes(q))) rows.push([g,b]); } }
  if (S.sort) rows = rows.slice().sort(([x,bx],[y,by]) => { const a = sortKey(x,S.sort,bx.fit,bx,T), c = sortKey(y,S.sort,by.fit,by,T);
    if (typeof a==="number" || typeof c==="number") { if (a===Infinity && c===Infinity) return 0; if (a===Infinity) return 1; if (c===Infinity) return -1; return S.dir*(a-c); }
    return S.dir*String(a).localeCompare(String(c)); });
  // the lowest of each column over the rows shown, whichever fit a row is of
  const best = []; for (let i=0;i<T.ncols;i++) { const v = rows.map(([g,b]) => b.keys[i] && !b.keys[i].diagonal && g.columns[b.keys[i].key]).filter(Boolean).map(c=>c.mean);
    best.push(v.length ? Math.min(...v) : undefined); }
  const shown = rows.length;
  for (const [g,b] of rows) { const fit = b.fit, id = (b.fit||"none")+"|"+g.group, r = (g.rank||{})[fit];
    h += '<tr class="row"><td class="ent"><b data-id="'+esc(id)+'">'+esc(g.name)+'</b>'+chips(g,fit)+'</td>';
    h += '<td class="meta">'+esc(g.base)+'</td><td class="meta">'+esc(g.method)+'</td><td class="meta" title="'+esc(fittedOf(g,fit,T))+'">'+esc(fittedOf(g,fit,T))+'</td>';
    b.keys.forEach((k,i) => { const c = g.columns[k.key]; const cls = ["num"]; if (k.diagonal) cls.push("diag");
      if (c && !k.diagonal && best[i]!==undefined && c.mean===best[i] && rows.length>1) cls.push("best");
      let tt = k.title; if (k.diagonal) tt += " — on target" + (r ? ", rank "+r.rank+" of "+r.of : "");
      if (c && c.n>1) tt += " · n="+c.n;
      h += '<td class="'+cls.join(" ")+'" title="'+esc(tt)+'">'+fmt(c, k.dec, g.n)+'</td>'; });
    h += '</tr>';
    if (S.open[id]) h += detail(g, fit, span); }
  if (!shown) h += '<tr><td class="empty" colspan="'+span+'">No entries match.</td></tr>';
  h += '</tbody>';
  const el = document.getElementById("t"); el.innerHTML = h;
  document.getElementById("count").textContent = shown + " of " + T.blocks.reduce((a,b)=>a+b.rows.length,0) + " rows";
  for (const th of el.querySelectorAll("th.sort")) th.onclick = () => { const k = th.dataset.k;
    if (S.sort===k) { if (S.dir>0) S.dir=-1; else { S.sort=null; S.dir=1; } } else { S.sort=k; S.dir=1; } table(); };
  for (const b of el.querySelectorAll("td.ent b")) b.onclick = () => { S.open[b.dataset.id] = !S.open[b.dataset.id]; table(); }; }

function legend(){
  document.getElementById("legend").innerHTML = '<span><b>bold</b> lowest off-target value in the column</span>'
    + '<span>dimmed: on target</span><span>— not measured</span>'; }

function draw(){ tabs(); bar(); table(); legend(); }
S.tab = D.tables.some(t=>t.key===location.hash.slice(1)) ? location.hash.slice(1) : D.tables[0].key;
draw();
</script></div></body></html>
